name: Deploy to cPanel (Dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Checkout Code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4.5' # Sesuaikan dengan versi PHP di cPanel Anda

    - name: 📦 Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: 🗑️ Prepare files for SCP (Hapus file yang tidak perlu dikirim)
      run: rm -rf .git .github node_modules

    - name: 🚀 Upload files via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.CPANEL_SSH_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        source: "."
        target: ${{ secrets.CPANEL_TARGET_DIR }}
        # Jika Anda ingin menyimpan struktur folder storage yang sudah ada di server, tambahkan ini:
        rm: false

    - name: ⚙️ Execute Post-Deploy Commands via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.CPANEL_SSH_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        script: |
          cd ${{ secrets.CPANEL_TARGET_DIR }}
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
